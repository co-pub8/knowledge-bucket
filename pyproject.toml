[project]
name = "kb-tools"
version = "0.2.0"
description = "A local-first, Markdown-native knowledge bucket CLI with embedded RAG, fine-tuning, and evaluation workflows."
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "jinno" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "flask>=3.0",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "build>=1.0",
]
export = [
    "pyarrow>=14.0",
]
vector = [
    "numpy>=1.24",
]
storage = [
    "boto3>=1.28",
]
embedding = [
    "sentence-transformers>=3.0",
]

[project.scripts]
kb = "kb.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kb = ["prompts/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (build + venv install; opt-in via -m slow)",
]
