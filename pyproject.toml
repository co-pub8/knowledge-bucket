[project]
name = "kb-tools"
version = "0.2.0"
description = "A local-first, Markdown-native knowledge bucket CLI with embedded RAG, fine-tuning, and evaluation workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "knowledge-base",
    "knowledge-management",
    "rag",
    "retrieval-augmented-generation",
    "vector-search",
    "markdown",
    "fine-tuning",
    "sft",
    "sqlite",
    "fts5",
    "llm",
    "cli",
]
authors = [
    { name = "jinno", email = "jinno@example.com" },
]
maintainers = [
    { name = "jinno", email = "jinno@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "flask>=3.0",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/nobu007/knowledge-bucket"
Repository = "https://github.com/nobu007/knowledge-bucket"
Issues = "https://github.com/nobu007/knowledge-bucket/issues"
Changelog = "https://github.com/nobu007/knowledge-bucket/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
export = [
    "pyarrow>=14.0",
]
vector = [
    "numpy>=1.24",
]
storage = [
    "boto3>=1.28",
]
embedding = [
    "sentence-transformers>=3.0",
]

[project.scripts]
kb = "kb.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kb = ["prompts/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (build + venv install; opt-in via -m slow)",
]
