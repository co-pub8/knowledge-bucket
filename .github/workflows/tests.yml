name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,vector,export,storage]"
      - run: ruff check src/ tests/
      - run: pytest tests/ -q

  demo-smoke:
    # Exercises examples/demo.sh --smoke end-to-end. The smoke mode skips
    # every LLM-touching step, so it does not need KB_AGENT_PROXY. It
    # still runs the real `kb ingest` / `kb index` / `kb models add`
    # code paths against the bundled demo bucket. ~2-3 minutes on a
    # clean ubuntu-latest runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kb-tools
        run: pip install -e ".[dev]"
      - name: Run demo smoke
        timeout-minutes: 3
        run: bash examples/demo.sh --smoke

  install-smoke:
    # Build the wheel and install it into a fresh venv, then smoke test
    # the installed entry point end-to-end. This catches sdist / wheel
    # regressions that the editable `pip install -e .[dev]` in `test`
    # would miss (e.g. missing package data, broken console_scripts).
    # Runs only after `test` is green to keep CI fast.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build --wheel
      - name: Create fresh venv
        run: python -m venv .venv-smoke
      - name: Install wheel into fresh venv
        run: |
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
      - name: Smoke test installed entry point
        run: |
          set -e
          . .venv-smoke/bin/activate
          kb --version
          kb --help | head -n 5
          cd "$RUNNER_TEMP"
          kb init kb-smoke
          (cd kb-smoke && kb add --title smoke --content "hello kb")
          kb search "hello" --path kb-smoke
      - name: Cleanup venv
        if: always()
        run: rm -rf .venv-smoke
