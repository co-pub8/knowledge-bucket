name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,vector,export,storage]"
      - run: ruff check src/ tests/
      - run: pytest tests/ -q

  demo-smoke:
    # Exercises examples/demo.sh --smoke end-to-end. The smoke mode skips
    # every LLM-touching step, so it does not need KB_AGENT_PROXY. It
    # still runs the real `kb ingest` / `kb index` / `kb models add`
    # code paths against the bundled demo bucket. ~2-3 minutes on a
    # clean ubuntu-latest runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kb-tools
        run: pip install -e ".[dev]"
      - name: Run demo smoke
        timeout-minutes: 3
        run: bash examples/demo.sh --smoke
